# =========================================================
# CIVICPULSE APPLICATION
# =========================================================

spring.application.name=civicpulse-backend
server.port=8080


# =========================================================
# MYSQL DATABASE CONFIGURATION
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/civicpulse_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000


# =========================================================
# JPA / HIBERNATE
# =========================================================

# Local development only; use Flyway or Liquibase in production.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# =========================================================
# JWT AUTHENTICATION
# =========================================================

# Development fallback only. Set JWT_SECRET to a unique,
# randomly generated secret of at least 32 bytes.
app.jwt.secret=${JWT_SECRET:dev-only-change-this-secret-key-32-bytes-minimum!!}

# Token expiration: 24 hours
app.jwt.expiration-ms=86400000


# =========================================================
# CORS CONFIGURATION
# =========================================================

# Allows the local Vite frontend to call the backend.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}


# =========================================================
# ISSUE MANAGEMENT
# =========================================================

app.issues.duplicate-radius-meters=${DUPLICATE_RADIUS_METERS:500}
app.issues.default-page-size=10
app.issues.max-page-size=100


# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.security=INFO
logging.level.com.civicpulse=INFO


# =========================================================
# SWAGGER / OPENAPI DOCUMENTATION
# =========================================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


# =========================================================
# INITIAL ADMINISTRATOR
# =========================================================

# Leave these blank unless you intentionally want to bootstrap
# the first administrator. Configure them through environment
# variables when starting the application.
# Initial Administrator Credentials
app.bootstrap-admin.email=admin@gmail.com
app.bootstrap-admin.password=CivicPulse@Admin2026!
app.bootstrap-admin.name=CivicPulse Administrator


# =========================================================
# FILE UPLOAD CONFIGURATION
# =========================================================

app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.max-bytes=5242880

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB