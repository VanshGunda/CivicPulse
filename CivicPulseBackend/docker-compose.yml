services:
  mysql:
    image: mysql:8.4
    container_name: civicpulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: civicpulse_db
      MYSQL_USER: civicpulse
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-this-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
    ports:
      - "3306:3306"
    volumes:
      - civicpulse_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change-this-root-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  civicpulse_mysql_data:
